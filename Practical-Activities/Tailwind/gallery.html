<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | My Tailwind Website</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-950 bg-[url('images/tailwind-bg.jpg')] bg-cover bg-center bg-fixed bg-no-repeat text-slate-100">
    <header class="flex flex-col items-center justify-between gap-4 bg-slate-950/85 p-4 shadow-lg shadow-cyan-950/40 sm:flex-row">
        <h1 class="text-center text-2xl font-bold text-white sm:text-3xl">My Tailwind Website</h1>
        <nav class="flex flex-wrap justify-center gap-2">
            <a href="index.html"
                class="rounded border border-cyan-300/50 bg-cyan-400/20 px-3 py-1 text-sm font-semibold text-cyan-50 hover:bg-cyan-300/30">Home</a>
            <a href="gallery.html"
                class="rounded border border-cyan-300 bg-cyan-300 px-3 py-1 text-sm font-semibold text-slate-950 hover:bg-white">Gallery</a>
            <a href="about.html"
                class="rounded border border-cyan-300/50 bg-cyan-400/20 px-3 py-1 text-sm font-semibold text-cyan-50 hover:bg-cyan-300/30">About
                us</a>
            <a href="index.html#contact"
                class="rounded border border-cyan-300/50 bg-cyan-400/20 px-3 py-1 text-sm font-semibold text-cyan-50 hover:bg-cyan-300/30">Contact</a>
        </nav>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-10">
        <section class="mb-8 text-center">
            <h2 class="text-4xl font-bold text-white">Gallery - Grids</h2>
            <p class="mt-3 text-2xl text-gray-300">A collection of beautiful images</p>
        </section>

        <section class="grid grid-cols-1 gap-3 rounded-lg border border-cyan-100/20 bg-slate-950/75 p-3 shadow-xl shadow-slate-950/40 sm:grid-cols-2 lg:grid-cols-3">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image1.jpg" alt="Gallery image 1">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image2.jpg" alt="Gallery image 2">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image3.jpg" alt="Gallery image 3">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image4.jpg" alt="Gallery image 4">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image5.jpg" alt="Gallery image 5">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image6.jpg" alt="Gallery image 6">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image7.jpg" alt="Gallery image 7">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image8.jpg" alt="Gallery image 8">
            <img class="h-64 w-full rounded border-2 border-gray-400 object-cover" src="images/galleryimages/image9.jpg" alt="Gallery image 9">
        </section>
    </main>

    <footer class="flex justify-center bg-slate-950/90 p-6 text-slate-200">
        <div class="text-center">
            <ul class="flex flex-wrap justify-center gap-2">
                <li><a href="index.html"
                        class="rounded border border-cyan-300/50 bg-cyan-400/20 px-3 py-1 text-sm font-semibold text-cyan-50 hover:bg-cyan-300/30">Home</a>
                </li>
                <li><a href="gallery.html"
                        class="rounded border border-cyan-300 bg-cyan-300 px-3 py-1 text-sm font-semibold text-slate-950 hover:bg-white">Gallery</a>
                </li>
                <li><a href="about.html"
                        class="rounded border border-cyan-300/50 bg-cyan-400/20 px-3 py-1 text-sm font-semibold text-cyan-50 hover:bg-cyan-300/30">About
                        us</a></li>
                <li><a href="index.html#contact"
                        class="rounded border border-cyan-300/50 bg-cyan-400/20 px-3 py-1 text-sm font-semibold text-cyan-50 hover:bg-cyan-300/30">Contact</a>
                </li>
            </ul>
            <p class="mt-5"> &copy; 2026 Bruno Gomes ltd.</p>
            <p class="mt-3">CR7 8DX <br>
                LivingPlace<br>
                4444
            </p>
            <p class="mt-3 text-cyan-100">brought to you by TailwindCSS</p>
        </div>
    </footer>
</body>

</html>
